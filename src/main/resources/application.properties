spring.application.name=fisio-royale-leads
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.properties.hibernate.default_batch_fetch_size=100

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript,text/javascript
server.compression.min-response-size=1024

phase1.base-url=${PHASE1_BASE_URL}
phase1.token=${PHASE1_INTEGRATION_TOKEN:}
